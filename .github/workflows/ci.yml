name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: uv pip install --system -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

  dogfood:
    name: dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: uv pip install --system -e .

      # good-skill is clean and MUST pass at warning+.
      - name: Lint examples/good-skill (must pass)
        run: promptproof examples/good-skill --fail-level warning

      # bad-skill is a showcase of findings; never fail the build on it.
      - name: Lint examples/bad-skill (showcase, never fails)
        run: promptproof examples/bad-skill --exit-zero
